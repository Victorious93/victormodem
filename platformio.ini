; VictorModem build envs. Same phone protocol (BLE GATT + Wi-Fi WS) in all of them.
[platformio]
default_envs = esp32s3_bridge5g, esp32s3_direct4g, tsim7600_4g

[common]
framework = arduino
platform = espressif32
monitor_speed = 115200
fw_flags = -DVM_FW_VERSION=\"0.2.0\"
lib_deps =
  bblanchon/ArduinoJson@^7
  links2004/WebSockets@^2.4.1

; 5G: ESP32-S3 is a BLE/Wi-Fi bridge; Raspberry Pi 5 hub owns the SIM8262A (UART JSON link)
[env:esp32s3_bridge5g]
extends = common
board = esp32-s3-devkitc-1
build_flags = ${common.fw_flags} -DVM_PIO_ENV=\"$PIOENV\" -DCORE_DEBUG_LEVEL=3 -DARDUINO_USB_CDC_ON_BOOT=1 -DVM_MODE_BRIDGE
build_src_filter = +<*> -<modem.cpp> -<services.cpp>

; 4G: ESP32-S3 drives a SIM7600G-H directly over UART (e.g. LilyGO T-SIM7600G-H modem side)
[env:esp32s3_direct4g]
extends = common
board = esp32-s3-devkitc-1
build_flags = ${common.fw_flags} -DVM_PIO_ENV=\"$PIOENV\" -DCORE_DEBUG_LEVEL=3 -DARDUINO_USB_CDC_ON_BOOT=1 -DVM_MODE_DIRECT
build_src_filter = +<*> -<hub_link.cpp>

; 4G all-in-one: firmware on the LilyGO T-SIM7600G-H's own ESP32 (WROVER-B), onboard modem pins
[env:tsim7600_4g]
extends = common
board = esp32dev
board_build.partitions = huge_app.csv
build_flags = ${common.fw_flags} -DVM_PIO_ENV=\"$PIOENV\" -DCORE_DEBUG_LEVEL=3 -DVM_MODE_DIRECT -DBOARD_HAS_PSRAM
  -DMODEM_TX_PIN=27 -DMODEM_RX_PIN=26 -DMODEM_PWRKEY_PIN=4 -DMODEM_RESET_PIN=-1
  -DMODEM_RI_PIN=33 -DMODEM_FLIGHT_PIN=25
build_src_filter = +<*> -<hub_link.cpp>
