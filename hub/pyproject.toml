[project]
name = "victormodem-hub"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pyserial>=3.5"]
[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
[project.scripts]
victormodem-hub = "victormodem_hub.__main__:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
